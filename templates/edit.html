<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternConnect | Edit Application</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<main class="main-content">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash {{ category }}" role="status">
      {{ message }}
    </div>
    {% endfor %}
  {% endwith %}

  <section class="content-card">
    <div class="section-heading">
      <div>
        <span class="section-label">EDIT OPPORTUNITY</span>
        <h2>Edit Application</h2>
      </div>
    </div>

    <form action="{{ url_for('edit_application', application_id=application['id']) }}"
          method="post" class="application-form">

      <label>
        Company Name
        <input type="text" name="company"
               value="{{ application['company'] }}"
               maxlength="120" required>
      </label>

      <label>
        Position
        <input type="text" name="position"
               value="{{ application['position'] }}"
               maxlength="120" required>
      </label>

      <label>
        Application Deadline
        <input type="date" name="deadline"
               value="{{ application['deadline'] or '' }}">
      </label>

      <button type="submit" class="primary-button">Save Changes</button>
      <a href="{{ url_for('index') }}#applications">Cancel</a>
    </form>
  </section>

</main>
</body>
</html>
